<style>
  :root{
    --cream:#f7f1e6;
    --cream-2:#efe4d0;
    --paper:#fffaf2;
    --ink:#241d16;
    --ink-soft:#6b5b4d;
    --rust:#216b3f;
    --rust-dark:#174d2d;
    --gold:#c8973e;
    --olive:#6b7a4f;
    --line:#e6dbc4;
    --shadow: 0 1px 2px rgba(31,26,20,0.05), 0 6px 16px rgba(31,26,20,0.07);
    --shadow-lg: 0 4px 10px rgba(31,26,20,0.07), 0 20px 44px rgba(31,26,20,0.16);
    --font-display: 'Avenir Next', 'Century Gothic', Futura, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--rust);
    color:var(--cream);
    padding:20px 24px;
    position:sticky; top:0; z-index:40;
    border-bottom:1px solid rgba(0,0,0,0.1);
  }
  .top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-logo{height:60px;width:auto;display:block;}
  .brand h1{font-size:36px;margin:0;letter-spacing:-0.02em;font-weight:800;}

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}
  .layout{display:grid;grid-template-columns:270px 1fr;gap:26px;align-items:start;}
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} }

  /* ---------- Sidebar / filters ---------- */
  .panel{
    background:var(--paper);
    border:1px solid rgba(58,44,34,0.06);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
  }
  .panel + .panel{margin-top:16px;}
  .panel h3{margin:0 0 14px;font-size:13px;color:var(--rust-dark);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;}
  .search-box{position:sticky; top:96px;}
  input[type="text"], input[type="search"]{
    width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:var(--radius-sm);
    background:var(--cream);color:var(--ink);font-size:14.5px;transition:border-color .15s;
  }
  input[type="text"]:focus, input[type="search"]:focus{outline:none;border-color:var(--rust);}
  .filter-group{margin-bottom:14px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
  select{
    width:100%;padding:9px 10px;border:1.5px solid transparent;border-radius:var(--radius-sm);background:var(--cream);color:var(--ink);font-size:14px;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--cream);
    font-size:12.5px;cursor:pointer;user-select:none;transition:all .15s;
  }
  .chip.active{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600;}

  /* ---------- Capsule filters ---------- */
  .capsule-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .capsule-select{
    padding:8px 12px;border-radius:999px;border:none;
    background:var(--rust);color:#fff;font-size:12.5px;font-weight:700;
    cursor:pointer;max-width:100%;
  }
  .capsule-select:focus{outline:2px solid var(--rust-dark);outline-offset:1px;}
  .capsule-toggle{
    padding:8px 16px;border-radius:999px;background:var(--cream-2);border:1px solid rgba(58,44,34,0.08);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;user-select:none;
    transition:all .15s;display:inline-flex;align-items:center;gap:4px;
  }
  .capsule-toggle.active{background:var(--olive);color:#fff;border-color:var(--olive);}

  /* ---------- Search dropdown ---------- */
  .search-wrap{position:relative;}
  .search-dropdown{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:60;display:none;
  }
  .search-dropdown.show{display:block;}
  .search-dropdown-item{
    padding:10px 14px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .search-dropdown-item:last-child{border-bottom:none;}
  .search-dropdown-item:hover{background:var(--cream-2);}
  .search-dropdown-item .sdi-cat{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
  .search-dropdown-empty{padding:14px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13.5px;}
  .switch{position:relative;width:38px;height:21px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d8c9ac;border-radius:20px;transition:.2s;}
  .slider:before{position:absolute;content:"";height:15px;width:15px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--olive);}
  input:checked + .slider:before{transform:translateX(17px);}
  .reset-btn{
    width:100%;margin-top:14px;padding:10px;border:1.5px solid var(--rust);color:var(--rust);
    background:transparent;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-weight:700;transition:all .15s;
  }
  .reset-btn:hover{background:var(--rust);color:#fff;}

  /* ---------- Pantry ---------- */
  #pantryInput{min-height:68px;resize:vertical;width:100%;padding:12px;border:1.5px solid transparent;border-radius:var(--radius-sm);background:var(--cream);font-family:inherit;font-size:13.5px;}
  #pantryInput:focus{outline:none;border-color:var(--olive);}
  .pantry-btn{
    width:100%;margin-top:10px;padding:11px;border:none;border-radius:var(--radius-sm);background:var(--olive);color:#fff;
    font-weight:700;font-size:13.5px;cursor:pointer;transition:opacity .15s;
  }
  .pantry-btn:hover{opacity:0.88;}
  .pantry-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .pantry-clear{background:transparent;border:none;color:var(--rust);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-top:6px;}

  /* ---------- Main / grid ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .toolbar .result-count{font-size:14px;color:var(--ink-soft);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:8px 18px;border-radius:999px;background:var(--paper);border:1px solid rgba(58,44,34,0.08);font-size:13px;cursor:pointer;font-weight:700;color:var(--ink-soft);transition:all .15s;}
  .tab.active{background:var(--rust);color:#fff;border-color:var(--rust);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .card{
    background:var(--paper);border:1px solid rgba(58,44,34,0.06);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;
    box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
  .card-head{
    background:var(--cream-2);padding:18px 18px 12px;position:relative;
  }
  .fav-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.5);border-radius:50%;border:none;font-size:17px;cursor:pointer;color:var(--rust);opacity:0.7;transition:all .15s;}
  .fav-btn:hover{opacity:1;background:rgba(255,255,255,0.85);}
  .fav-btn.active{opacity:1;}
  .card-head .cat-badge{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--rust-dark);font-weight:700;}
  .card-head h4{margin:8px 34px 0 0;font-size:17px;line-height:1.25;}
  .card-body{padding:12px 16px 16px;font-size:12.8px;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;flex:1;}
  .meta-row{display:flex;gap:10px;flex-wrap:wrap;}
  .meta-item{display:flex;align-items:center;gap:4px;}
  .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .tag{font-size:10.5px;padding:3px 10px;border-radius:999px;background:var(--cream-2);color:var(--ink-soft);font-weight:600;}
  .tag.healthy{background:#e4ebd9;color:#4a5c33;}
  .tag.robot{background:#f0e2c8;color:var(--rust-dark);}
  .tag.web{background:#dfe8ee;color:#2f5266;}
  .match-badge{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--olive);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(58,44,34,0.55);display:none;align-items:flex-start;justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);max-width:720px;width:100%;border-radius:var(--radius-lg);box-shadow:0 24px 70px rgba(0,0,0,0.32);
    overflow:hidden;margin-bottom:40px;
  }
  .modal-head{background:var(--rust);color:var(--cream);padding:28px 28px 22px;position:relative;}
  .modal-head .cat-badge{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.85;font-weight:700;}
  .modal-head h2{margin:8px 0 0;font-size:28px;}
  .modal-close{position:absolute;top:18px;right:20px;background:rgba(255,255,255,0.2);border:none;color:#fff;
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;transition:background .15s;}
  .modal-close:hover{background:rgba(255,255,255,0.35);}
  .modal-meta{display:flex;flex-wrap:wrap;gap:14px;padding:16px 28px;background:var(--cream-2);border-bottom:1px solid var(--line);font-size:13px;}
  .modal-meta .m-item b{display:block;font-size:15px;color:var(--ink);}
  .modal-body{padding:22px 28px 28px;}
  .modal-body h3{font-size:15px;text-transform:uppercase;letter-spacing:0.05em;color:var(--rust-dark);margin:20px 0 10px;}
  .modal-body h3:first-child{margin-top:0;}
  .modal-body ul{margin:0;padding-left:20px;}
  .modal-body li{margin-bottom:6px;line-height:1.5;font-size:14.5px;}
  .modal-body ol{margin:0;padding-left:20px;}
  .modal-body ol li{margin-bottom:12px;line-height:1.55;font-size:14.5px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .badge{font-size:11.5px;padding:5px 12px;border-radius:999px;background:var(--cream-2);border:1px solid rgba(58,44,34,0.06);font-weight:600;}
  .tip-box{background:#faf0dc;border-left:3px solid var(--gold);padding:14px 18px;border-radius:var(--radius-sm);font-size:13.5px;margin-top:20px;}
  .cal-disclaimer{font-size:11px;color:var(--ink-soft);font-style:italic;margin-top:4px;}
  .source-line{font-size:11px;color:var(--ink-soft);margin-top:8px;}
  .source-line a{color:var(--rust-dark);font-weight:600;}

  footer{text-align:center;padding:30px 20px;color:var(--ink-soft);font-size:12.5px;}
</style>
</head>

<script>
const RECIPES = JSON.parse(document.getElementById('recipesData').textContent);

const state = {
  search: '',
  mealType: '',
  maxCal: 9999,
  maxTime: 9999,
  healthy: false,
  pantryActive: false,
  pantryList: []
};

const MEAL_TYPE_CATS = {
  starters: ['entrantes','sopa','basicas'],
  main: ['principal'],
  dessert: ['postre']
};

let favorites = [];
try{ favorites = JSON.parse(localStorage.getItem('sherichefs_favs') || '[]'); }catch(e){ favorites = []; }

function saveFavs(){ localStorage.setItem('sherichefs_favs', JSON.stringify(favorites)); }
function toggleFav(id){
  const i = favorites.indexOf(id);
  if(i>-1){ favorites.splice(i,1); } else { favorites.push(id); }
  saveFavs();
  render();
}

function normalize(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}

function pantryMatchScore(recipe, pantryTokens){
  if(!pantryTokens.length) return null;
  const ingNorm = recipe.ingredients.map(normalize);
  let matched = 0;
  pantryTokens.forEach(tok=>{
    if(ingNorm.some(ing => ing.includes(tok))) matched++;
  });
  // score = fraction of recipe's ingredients that are "covered" isn't quite right;
  // instead score by how many pantry tokens are used AND how many of the recipe's ingredient lines are matched
  let ingCovered = 0;
  ingNorm.forEach(ing=>{
    if(pantryTokens.some(tok=> ing.includes(tok))) ingCovered++;
  });
  const coverage = recipe.ingredients.length ? ingCovered/recipe.ingredients.length : 0;
  return {matchedTokens:matched, coverage:coverage};
}

function getFiltered(){
  let list = RECIPES.slice();
  const q = normalize(state.search);
  if(q){
    list = list.filter(r=>{
      if(normalize(r.name).includes(q)) return true;
      return r.ingredients.some(i=>normalize(i).includes(q));
    });
  }
  if(state.mealType && MEAL_TYPE_CATS[state.mealType]) list = list.filter(r=>MEAL_TYPE_CATS[state.mealType].includes(r.cat));
  if(state.maxCal < 9999) list = list.filter(r=>r.calories <= state.maxCal);
  if(state.maxTime < 9999) list = list.filter(r=>r.time <= state.maxTime);
  if(state.healthy) list = list.filter(r=>r.healthy);

  if(state.pantryActive && state.pantryList.length){
    list = list.map(r=>({r, score: pantryMatchScore(r, state.pantryList)}))
      .filter(x=>x.score.matchedTokens>0)
      .sort((a,b)=> b.score.coverage - a.score.coverage || b.score.matchedTokens - a.score.matchedTokens)
      .map(x=>Object.assign({}, x.r, {_matchInfo:x.score}));
  }
  return list;
}

function timeLabel(mins){
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h' + (m? ' '+m+'min':'');
}

function cardHTML(r){
  const isFav = favorites.includes(r.id);
  let matchBadge = '';
  if(r._matchInfo){
    matchBadge = '<div class="match-badge">✓ '+Math.round(r._matchInfo.coverage*100)+'% de ingredientes que tienes</div>';
  }
  const tags = [];
  if(r.robotOnly) tags.push('<span class="tag robot">Solo robot</span>');
  if(r.healthy) tags.push('<span class="tag healthy">Healthy</span>');
  if(r.caldo) tags.push('<span class="tag">Caldo/crema</span>');
  if(r.estofado) tags.push('<span class="tag">Estofado</span>');
  if(r.sourceUrl) tags.push('<span class="tag web">🌐 Web verificada</span>');
  r.regional.forEach(reg=> tags.push('<span class="tag">'+reg+'</span>'));

  return '<div class="card" data-id="'+r.id+'">'
    +'<div class="card-head">'
      +'<button class="fav-btn '+(isFav?'active':'')+'" data-fav="'+r.id+'">'+(isFav?'♥':'♡')+'</button>'
      +'<div class="cat-badge">'+r.catLabel + (r.subLabel? ' · '+r.subLabel : '')+'</div>'
      +'<h4 class="serif">'+r.name+'</h4>'
    +'</div>'
    +'<div class="card-body">'
      +'<div class="meta-row">'
        +'<div class="meta-item">⏱ '+timeLabel(r.time)+'</div>'
        +'<div class="meta-item">🔥 ~'+r.calories+' kcal</div>'
        +'<div class="meta-item">👥 '+r.servings+'</div>'
      +'</div>'
      +(tags.length? '<div class="tag-row">'+tags.join('')+'</div>' : '')
      +matchBadge
    +'</div>'
  +'</div>';
}

function render(){
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = list.length + ' receta' + (list.length===1?'':'s');
  if(!list.length){
    grid.innerHTML='';
    empty.style.display='block';
  } else {
    empty.style.display='none';
    grid.innerHTML = list.map(cardHTML).join('');
  }
  grid.querySelectorAll('.fav-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      toggleFav(btn.getAttribute('data-fav'));
    });
  });
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openModal(card.getAttribute('data-id')));
  });
}

function openModal(id){
  const r = RECIPES.find(x=>x.id===id);
  if(!r) return;
  const isFav = favorites.includes(r.id);
  const accessories = r.accessories.length? r.accessories.map(a=>'<span class="badge">🔧 '+a+'</span>').join('') : '<span class="badge">Sin accesorios especiales</span>';
  const programs = r.programs.length? r.programs.map(p=>'<span class="badge">⚙ '+p+'</span>').join('') : '';

  const html = ''
  +'<div class="modal-head">'
    +'<button class="modal-close" id="modalCloseBtn">✕</button>'
    +'<div class="cat-badge">'+r.catLabel+(r.subLabel? ' · '+r.subLabel:'')+'</div>'
    +'<h2 class="serif">'+r.name+' '+(isFav?'♥':'♡')+'</h2>'
  +'</div>'
  +'<div class="modal-meta">'
    +'<div class="m-item"><b>'+timeLabel(r.time)+'</b>Tiempo total</div>'
    +'<div class="m-item"><b>'+r.servings+'</b>Raciones</div>'
    +'<div class="m-item"><b>~'+r.calories+' kcal</b>Por ración (estimado)</div>'
  +'</div>'
  +'<div class="modal-body">'
    +'<h3>Accesorios y programas</h3>'
    +'<div class="badge-row">'+accessories+programs+'</div>'
    +'<h3>Ingredientes</h3>'
    +'<ul>'+r.ingredients.map(i=>'<li>'+i+'</li>').join('')+'</ul>'
    +'<h3>Preparación</h3>'
    +'<ol>'+r.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'
    +(r.tip? '<div class="tip-box"><b>Consejo:</b> '+r.tip+'</div>' : '')
    +'<div class="cal-disclaimer">* Las calorías son una estimación orientativa (no aparecen en la receta original) y '+(r.regional.length? 'la etiqueta regional es una clasificación de estilo, no una denominación de origen oficial.':'pueden variar según ingredientes exactos.')+'</div>'
    +'<div class="source-line">Fuente: '+(r.sourceUrl? '<a href="'+r.sourceUrl+'" target="_blank" rel="noopener">'+r.source+' ↗</a>' : r.source)+'</div>'
  +'</div>';

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// ---- Search dropdown ----
function renderSearchDropdown(){
  const dd = document.getElementById('searchDropdown');
  const q = normalize(state.search);
  if(!q){ dd.classList.remove('show'); dd.innerHTML=''; return; }
  const matches = RECIPES.filter(r=>normalize(r.name).includes(q)).slice(0, 12);
  if(!matches.length){
    dd.innerHTML = '<div class="search-dropdown-empty">Sin resultados para "'+state.search+'"</div>';
  } else {
    dd.innerHTML = matches.map(r=>
      '<div class="search-dropdown-item" data-id="'+r.id+'"><span>'+r.name+'</span><span class="sdi-cat">'+r.catLabel+'</span></div>'
    ).join('');
    dd.querySelectorAll('.search-dropdown-item[data-id]').forEach(item=>{
      item.addEventListener('click', ()=>{
        dd.classList.remove('show');
        openModal(item.getAttribute('data-id'));
      });
    });
  }
  dd.classList.add('show');
}
document.addEventListener('click', e=>{
  const wrap = document.querySelector('.search-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('searchDropdown').classList.remove('show');
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.getElementById('searchDropdown').classList.remove('show');
});

// ---- Filter wiring ----
document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderSearchDropdown(); render(); });
document.getElementById('calFilter').addEventListener('change', e=>{ state.maxCal=parseInt(e.target.value); render(); });
document.getElementById('timeFilter').addEventListener('change', e=>{ state.maxTime=parseInt(e.target.value); render(); });
document.getElementById('mealTypeFilter').addEventListener('change', e=>{ state.mealType=e.target.value; render(); });
document.getElementById('healthyCapsule').addEventListener('click', ()=>{
  state.healthy = !state.healthy;
  document.getElementById('healthyCapsule').classList.toggle('active', state.healthy);
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.search=''; state.mealType=''; state.maxCal=9999; state.maxTime=9999; state.healthy=false;
  document.getElementById('searchInput').value='';
  document.getElementById('calFilter').value='9999';
  document.getElementById('timeFilter').value='9999';
  document.getElementById('mealTypeFilter').value='';
  document.getElementById('healthyCapsule').classList.remove('active');
  document.getElementById('searchDropdown').classList.remove('show');
  render();
});

document.getElementById('pantryBtn').addEventListener('click', ()=>{
  const raw = document.getElementById('pantryInput').value;
  const tokens = raw.split(',').map(s=>normalize(s.trim())).filter(Boolean);
  state.pantryList = tokens;
  state.pantryActive = tokens.length>0;
  localStorage.setItem('sherichefs_pantry', raw);
  render();
});
document.getElementById('pantryClear').addEventListener('click', ()=>{
  state.pantryActive=false; state.pantryList=[];
  render();
});

const savedPantry = localStorage.getItem('sherichefs_pantry');
if(savedPantry) document.getElementById('pantryInput').value = savedPantry;


render();
</script>

<script>
if('serviceWorker' in navigator){
  try{
    const swCode = "self.addEventListener('install',e=>self.skipWaiting());"
      + "self.addEventListener('activate',e=>self.clients.claim());"
      + "self.addEventListener('fetch',e=>{e.respondWith((async()=>{const cache=await caches.open('sherichefs-v1');try{const res=await fetch(e.request);cache.put(e.request,res.clone());return res;}catch(err){const cached=await cache.match(e.request);if(cached)return cached;throw err;}})());});";
    const blob = new Blob([swCode], {type: 'text/javascript'});
    const swUrl = URL.createObjectURL(blob);
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    });
  }catch(e){}
}
</script>
</body>
